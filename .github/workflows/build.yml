name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (désactive argLine pour PIT)
        run: mvn -q clean test -DargLine=

      - name: Run PIT mutation testing
        run: |
          mvn -q org.pitest:pitest-maven:mutationCoverage -pl navigation
          echo "----- SCORE DE MUTATION -----"
          grep -R "Mutation score" navigation/target/pit-reports/*/index.html || true
