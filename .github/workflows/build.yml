name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven install
          mvn -B clean install -DargLine=

      - name: Télécharger le score précédent
        if: matrix.java-version == 24
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: mutation-score
          workflow: build.yml
          path: ./old-score

      - name: Set up Java 17 for PIT
        if: matrix.java-version == 24
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      
      - name: Lancer PIT
        if: matrix.java-version == 24
        id: pitest
        run: |
          mvn -q -DargLine= org.pitest:pitest-maven:mutationCoverage -pl navigation | tee pit.log
          NEW_SCORE=$(grep "Mutation score" -R navigation/target/pit-reports | grep -o '[0-9]*\.[0-9]*' | head -1)
          echo "nouveau_score=$NEW_SCORE" >> $GITHUB_OUTPUT


      - name: Comparer scores
        if: matrix.java-version == 24
        id: compare
        run: |
          NEW=${{ steps.pitest.outputs.nouveau_score }}
          if [ -f old-score/mutation-score.txt ]; then
            OLD=$(cat old-score/mutation-score.txt)
            echo "Ancien: $OLD%"
            echo "Nouveau: $NEW%"
            if [ "$NEW" -lt "$OLD" ]; then
              echo "Score diminué"
              exit 1
            fi
          else
            echo "Pas de score précédent"
          fi
          echo "$NEW" > mutation-score.txt

      - name: Sauvegarder nouveau score
        if: success() && matrix.java-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation-score.txt

      - name: Rickroll
        if: failure() && matrix.java-version == 24
        run: |
          echo " https://www.youtube.com/watch?v=dQw4w9WgXcQ"
