name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test 

      - name: PIT
        run: mvn -q -pl navigation org.pitest:pitest-maven:mutationCoverage

      - name: ExtraireScore
        id: score_mutation
        run: |
          FICHIER=$(find navigation/target/pit-reports -name "mutations.xml" | head -1)
          SCORE_ACTUEL=$(grep -oP 'coverage="\K[0-9]+' "$FICHIER")
          echo "valeur=$SCORE_ACTUEL" >> $GITHUB_OUTPUT

      - name: ChargerScorePrecedent
        id: score_precedent
        run: |
          if [ -f .github/mutation_score.txt ]; then SCORE_OLD=$(cat .github/mutation_score.txt); else SCORE_OLD=0; fi
          echo "valeur=$SCORE_OLD" >> $GITHUB_OUTPUT

      - name: EchouerSiBaisse
        if: ${{ steps.score_mutation.outputs.valeur < steps.score_precedent.outputs.valeur }}
        run: exit 1

      - name: MiseAJourScore
        if: ${{ steps.score_mutation.outputs.valeur >= steps.score_precedent.outputs.valeur }}
        run: |
          echo "${{ steps.score_mutation.outputs.valeur }}" > .github/mutation_score.txt
      - name: Rickroll
        if: failure()
        run: |
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"


