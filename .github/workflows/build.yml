name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build project
        run: mvn -B clean install

      - name: Run PIT
        if: matrix.java-version == 24
        id: pit
        run: |
          mvn -q org.pitest:pitest-maven:mutationCoverage -pl navigation

          REPORT=$(find navigation/target/pit-reports -name "mutations.xml" | head -n 1)

          if [ -z "$REPORT" ]; then
            echo "Aucun rapport PIT trouvé."
            exit 1
          fi

          NEW_SCORE=$(grep -oPm1 "(?<=<mutationScore>)[0-9]+" "$REPORT")

          if [ -z "$NEW_SCORE" ]; then
            echo "Score de mutation introuvable."
            exit 1
          fi

          echo "score=$NEW_SCORE" >> $GITHUB_OUTPUT

      - name: Compare with previous score
        if: matrix.java-version == 24
        id: compare
        run: |
          NEW_SCORE=${{ steps.pit.outputs.score }}
          echo "Score actuel : $NEW_SCORE"

          if [ ! -f mutation-score.txt ]; then
            echo "$NEW_SCORE" > mutation-score.txt
            exit 0
          fi

          OLD_SCORE=$(cat mutation-score.txt)
          echo "Score précédent : $OLD_SCORE"

          if [ "$NEW_SCORE" -lt "$OLD_SCORE" ]; then
            echo "Score diminué : $OLD_SCORE → $NEW_SCORE"
            exit 1
          fi

          echo "$NEW_SCORE" > mutation-score.txt

      - name: Upload mutation score
        if: success() && matrix.java-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score
          path: mutation-score.txt

      - name: Rickroll on failure
        if: failure() && matrix.java-version == 24
        run: |
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
